<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List - Task Manager</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-4">
        <span class="navbar-brand mb-0 h1">My To-Do List</span>
      </div>
    </nav>

    <!-- Main Container Card -->
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 p-4">
            
            <!-- Page Heading & Subtitle -->
            <div class="text-center mb-4">
              <h2 class="fw-bold">Task Manager</h2>
              <p class="text-muted small">Organize your tasks and stay productive.</p>
            </div>

            <!-- Task Input Field & Add Task Button -->
            <div class="input-group mb-1">
  <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
  <button class="btn btn-primary" id="addTaskBtn" type="button">Add Task</button>
</div>
<!-- Error message container (hidden by default using Bootstrap's 'd-none') -->
<div id="errorMessage" class="text-danger small mb-3 d-none">Task cannot be empty or contain only spaces.</div>

            <!-- Task List Header & Counter -->
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-secondary small fw-bold">Your tasks</span>
              <span id="taskCounter" class="badge bg-primary">0 remaining</span>
            </div>

            <!-- Filter Buttons (Radio Group) -->
            <div class="btn-group w-100 mb-3" role="group" aria-label="Filter buttons">
              <input type="radio" class="btn-check" name="filterRadio" id="filterAll" autocomplete="off" checked>
              <label class="btn btn-outline-primary" for="filterAll">All</label>

              <input type="radio" class="btn-check" name="filterRadio" id="filterActive" autocomplete="off">
              <label class="btn btn-outline-primary" for="filterActive">Active</label>

              <input type="radio" class="btn-check" name="filterRadio" id="filterCompleted" autocomplete="off">
              <label class="btn btn-outline-primary" for="filterCompleted">Completed</label>
            </div>

            <!-- Task List Display Container -->
            <ul id="taskList" class="list-group mb-4">
              <li class="list-group-item text-center text-muted border-0 py-4" id="emptyState">
                No tasks yet. Add your first task!
              </li>
            </ul>

            <!-- Clear Completed Button -->
            <div class="text-end">
              <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
